[package]
name = "sovereign-policy-kernel"
version = "0.1.0"
edition = "2021"
description = "Sovereign Engine OS — Policy Kernel (Güvenlik Çekirdeği)"

[dependencies]
# JSON serileştirme — deny_unknown_fields için zorunlu
serde       = { version = "1.0.203", features = ["derive"] }
serde_json  = { version = "1.0.117", features = ["preserve_order"] }

# RFC 8785 Canonical JSON — deterministik hash için
serde_json_canonicalizer = "0.3.2"

# Kriptografi
sha2         = "0.11.0"
hex          = "0.4.3"
jsonwebtoken = "9.3.0"

# Hata yönetimi
thiserror = "1.0.61"

# Zaman yönetimi
chrono = { version = "0.4.38", features = ["serde"] }

[profile.release]
# Güvenlik: panik → anında sonlanma (stack unwinding yok)
panic         = "abort"
# Performans + binary küçültme
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
